  </text>
  
  <!-- Sous-titre officiel -->
  <text x="88" y="65" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1.5">
